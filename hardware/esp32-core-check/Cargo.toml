[package]
name         = "winterlock-esp32-core-check"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.95"
description  = "Checks winterlock-core against the Python vectors on a classic ESP32 and times the real operations"
publish      = false

[[bin]]
name = "winterlock-esp32-core-check"
path = "src/main.rs"
test = false
bench = false

[features]
# For QEMU only: presses BOOT on a script (QEMU can't), to run the button paths.
scripted-boot = []

[dependencies]
esp-hal                = { version = "~1.2.2", features = ["esp32", "unstable"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32"] }
esp-backtrace          = { version = "0.20.0", features = ["esp32", "panic-handler", "println"] }
esp-println            = { version = "0.18.0", features = ["esp32"] }
esp-alloc              = { version = "0.11.0", features = ["esp32", "internal-heap-stats"] }

# The core, with both keccak backends: the image times each (keccak::set_backend) and uses
# tiny-keccak until told otherwise.
winterlock-core = { path = "../../core", default-features = false, features = ["tiny-keccak", "sha3", "count"] }

# The optional OLED.
ssd1306           = "0.10"
embedded-graphics = "0.8"

critical-section = "1.2"

[build-dependencies]
serde_json = "1.0"

[profile.dev]
# The default debug profile is too slow and too big for the chip.
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = 3
