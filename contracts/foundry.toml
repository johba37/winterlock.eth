[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 1000000
# scripts and tests generate WOTS keys in Solidity, which uses a lot of memory
gas_limit = "max"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "account-abstraction/=lib/account-abstraction/contracts/",
  "kernel/=lib/kernel/src/",
  "solady/=lib/kernel/lib/solady/src/",
  "ExcessivelySafeCall/=lib/kernel/lib/ExcessivelySafeCall/src/",
]
fs_permissions = [{ access = "read-write", path = "./bench" }, { access = "read", path = "./lib/kernel/out" }]
