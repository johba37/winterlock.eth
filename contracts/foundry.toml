[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 1000000
# No metadata hash in the bytecode: the metadata records absolute build paths, so with a hash the bytecode, and the
# CREATE2 addresses of the deterministic deployment (D10), would depend on where the repository is checked out
bytecode_hash = "none"
# scripts and tests generate WOTS keys in Solidity, which uses a lot of memory
gas_limit = "max"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "account-abstraction/=lib/account-abstraction/contracts/",
  "kernel/=lib/kernel/src/",
  "solady/=lib/kernel/lib/solady/src/",
  "ExcessivelySafeCall/=lib/kernel/lib/ExcessivelySafeCall/src/",
  "safe-v1.4.1/=lib/safe-smart-account-v1.4.1/contracts/",
  "safe-v1.5.0/=lib/safe-smart-account-v1.5.0/contracts/",
]
fs_permissions = [
  { access = "read-write", path = "./bench" },
  { access = "read", path = "./lib/kernel/out" },
  { access = "read", path = "./test/fixtures" },
  # Safe's contracts, built with their release settings by setup.sh (solc 0.7.6, optimizer off)
  { access = "read", path = "./lib/safe-smart-account-v1.4.1/build/forge-out" },
  { access = "read", path = "./lib/safe-smart-account-v1.5.0/build/forge-out" },
]
additional_compiler_profiles = [{ name = "via-ir", via_ir = true }]
compilation_restrictions = [{ paths = "src/vendor/sphincs-minus/LeanSphincsAsm.sol", via_ir = true }]

[lint]
# forge's linter parses Solidity only; the frame account is a Yul object (it needs `verbatim` for the frame opcodes)
ignore = ["src/frame/WinterlockFrameAccount.yul"]
