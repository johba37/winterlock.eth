[package]
name         = "winterlock-core"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
description  = "Winterlock's signer core: keccak256, the recovery phrase, leanSphincs-keccak, WOTS (D6), owner v2 formats and the key log's rules. no_std with alloc."
license      = "MIT"
publish      = false

[features]
default     = ["tiny-keccak", "hbkd"]
# keccak256 backends: the Keccak-f[1600] permutation under the crate's own sponge. With both on, the
# backend is picked at run time (keccak::set_backend), tiny-keccak first.
tiny-keccak = ["dep:tiny-keccak"]
# RustCrypto's Keccak-f[1600]: the `keccak` crate, which RustCrypto's `sha3` is built on.
sha3        = ["dep:keccak"]
# Conveniences that need std (none of the formats or rules do).
std         = []
# Counts Keccak-f permutations (keccak::permutations), for measurements.
count       = []
# ERC-8499, hash-based key derivation from BIP-39: the hbkd module and derive::erc8499, the signer
# app's derivation since 2026-11-14. A feature so that crates built without default features (the
# ESP32 check images) keep their dependencies and lock files; core-wasm and the board enable it.
hbkd        = ["dep:hmac"]

[dependencies]
tiny-keccak = { version = "2.0.2", features = ["keccak"], optional = true }
keccak      = { version = "0.2.2", optional = true }
sha2        = { version = "0.10.9", default-features = false }
# HMAC-SHA512 for BIP-39's PBKDF2 and HKDF (hbkd): RustCrypto, no_std, on the same digest 0.10 as sha2.
hmac        = { version = "0.12.1", default-features = false, optional = true }

# On the ESP32 (Xtensa), sha2's compact software code. The default unrolls SHA-512's 80 rounds
# into 48.5 KB, more than the chip's 32 KB flash cache: on the board each block then ran from
# flash, about 6 ms, and a phrase's ERC-8499 root (PBKDF2, 2,048 rounds) took 25 s. The compact
# code is a loop of 3.8 KB. WebAssembly and native builds keep the unrolled code.
[target.'cfg(target_arch = "xtensa")'.dependencies]
sha2        = { version = "0.10.9", default-features = false, features = ["force-soft-compact"] }

[dev-dependencies]
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.test]
opt-level = 3

[profile.release]
codegen-units = 1
lto           = "fat"
